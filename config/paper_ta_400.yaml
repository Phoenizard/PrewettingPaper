# Publication-quality T-a supplement. Physical case values are supplied by
# --case-rel; all numerical settings below are frozen for EXP-TA-PANEL-01.

physical:
  L: 10.0
  N: 1000
  kappa_11: 1.0
  kappa_22: 1.0
  kappa_12: 0.0
  n1: 1.0
  n2: 1.0
  n3: 1.0
  chi_12: 0.0
  chi_13: 2.8
  chi_23: 0.0
  omega_1: -0.18
  omega_2: -0.30
  chi_bb_11: 0.0
  chi_bb_22: 0.0
  chi_bb_12: 0.0

solver:
  tol: 1.0e-8
  max_iter: 500
  min_alpha: 1.0e-3

scan:
  phi_min: 0.0001
  phi_max: 0.2
  n_scan: 400
  n_lines: 400
  amp_phi1_thin: 0.015
  amp_phi2_thin: 0.004
  amp_phi1_thick: 0.3
  amp_phi2_thick: 0.3

criterion:
  cs_threshold: 0.1
  min_hysteresis_points: 2

bulk:
  demixed_grid: 451
  demix_tol: 1.0e-5
  binodal_grid: 801
  k_nearest: 8
  vote_ratio: 0.5
